margin-bottom:22px}.heading h1{margin:0;font-size:27px;letter-spacing:-.8px}.sub{color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:0 2px 5px #17203305}.metriclabel{color:var(--muted);font-weight:600;font-size:12px}.metric{font-size:27px;font-weight:800;letter-spacing:-.7px;margin:8px 0}.hint{font-size:12px;color:var(--muted)}.sectiontitle{font-size:16px;font-weight:800;margin:0 0 15px}.split{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8290a5;background:#f8fafc;padding:12px 13px;border-bottom:1px solid var(--line)}td{padding:13px;border-bottom:1px solid #edf0f5}tbody tr:last-child td{border-bottom:0}.pill{display:inline-flex;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:750;background:#eff6ff;color:#1d4ed8}.pill.green{background:#dcfce7;color:#166534}.pill.amber{background:#fef3c7;color:#92400e}.pill.red{background:#fee2e2;color:#991b1b}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;outline-color:#93c5fd;background:white}.tools{display:flex;gap:10px;align-items:center;margin-bottom:15px}.tools .search{max-width:390px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:#526078;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #dce3ed;border-radius:8px;background:white}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#0f172a70;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:16px;padding:24px;width:min(600px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{padding:12px 14px;border-radius:10px;background:#eff6ff;color:#1e40af;margin-bottom:16px}.bar{height:8px;border-radius:99px;background:#eaf0f8;overflow:hidden}.bar span{display:block;height:100%;background:#3b82f6;border-radius:99px}.empty{padding:30px;text-align:center;color:var(--muted)}.posgrid{display:grid;grid-template-columns:1.3fr .8fr;gap:16px}.productcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.producttile{border:1px solid var(--line);border-radius:12px;padding:14px;background:white;text-align:left;color:var(--ink)}.producttile:hover{border-color:#93c5fd;background:#f8fbff}.producttile b{display:block;margin:7px 0}.producttile small{color:var(--muted)}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.totalrow{display:flex;justify-content:space-between;margin:10px 0}.bigtotal{font-size:25px;font-weight:850}.footerhint{color:#94a3b8;font-size:11px;margin-top:18px}.mobilemenu{display:none}

quotes:[{id:'COT-0301',date:today(),client:'Servicio Automotriz Roma',status:'Pendiente',total:1298,items:[{name:'Balatas delanteras cerámicas',qty:2,price:649}]}],

let state;try{state=JSON.parse(localStorage.getItem('refacpro-data'))||structuredClone(seed)}catch(e){state=structuredClone(seed)}
function save(){localStorage.setItem('refacpro-data',JSON.stringify(state))}
let page='dashboard',cart=[],searchTerm='';
const pageNames={dashboard:'Dashboard',pos:'Punto de venta',products:'Productos e inventario',purchases:'Compras',quotes:'Cotizaciones',sales:'Ventas',cash:'Caja',clients:'Clientes',suppliers:'Proveedores',reports:'Reportes',settings:'Configuración y respaldo'};
function go(p){page=p;searchTerm='';$('#crumb').textContent=pageNames[p];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#menubtn').onclick=()=>$('#sidebar').classList.toggle('open');
function heading(title,sub,actions=''){return '<div class="heading"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="actions">'+actions+'</div></div>'}
function btn(label,action,kind=''){return '<button class="'+kind+'" onclick="'+action+'">'+label+'</button>'}
function metric(label,value,hint,icon){return '<div class="card"><div style="display:flex;justify-content:space-between"><span class="metriclabel">'+label+'</span><span style="font-size:19px;color:#3b82f6">'+icon+'</span></div><div class="metric">'+value+'</div><div class="hint">'+hint+'</div></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+ (rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">No hay registros para mostrar</td></tr>')+'</tbody></table></div>'}
function badge(text,kind=''){return '<span class="pill '+kind+'">'+text+'</span>'}
function lowStock(){return state.products.filter(p=>p.stock<=p.min)}
function dash(){let revenue=state.sales.reduce((a,s)=>a+s.total,0),cost=state.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty*i.cost,0),0),inv=state.products.reduce((a,p)=>a+p.stock*p.cost,0);return heading('Buenos días, Administrador 👋','Este es el resumen de tu refaccionaria. Datos de demostración.',btn('＋ Nueva venta',"go('pos')")+btn('＋ Agregar producto',"productModal()",'secondary'))+'<div class="notice">ⓘ Estás usando datos ficticios de demostración. Los cambios se guardan en este navegador.</div><div class="grid">'+metric('Ventas registradas',money(revenue),state.sales.length+' operaciones','↗')+metric('Utilidad bruta estimada',money(revenue-cost),'Antes de gastos operativos','◈')+metric('Valor del inventario',money(inv),state.products.reduce((a,p)=>a+p.stock,0)+' piezas disponibles','▤')+metric('Productos por reordenar',lowStock().length,'Requieren atención','⚑')+'</div><div class="split"><div class="card"><h3 class="sectiontitle">Ventas recientes</h3>'+table(['Folio','Fecha','Cliente','Total','Estado'],state.sales.slice().reverse().slice(0,5).map(s=>'<tr><td><b>'+s.id+'</b></td><td>'+s.date+'</td><td>'+s.client+'</td><td><b>'+money(s.total)+'</b></td><td>'+badge(s.status,'green')+'</td></tr>'))+'</div><div class="card"><h3 class="sectiontitle">Inventario bajo</h3>'+table(['Producto','Existencia','Mínimo'],lowStock().map(p=>'<tr><td><b>'+p.name+'</b><div class="hint">'+p.id+'</div></td><td>'+badge(p.stock,p.stock===0?'red':'amber')+'</td><td>'+p.min+'</td></tr>'))+(lowStock().length?'':'<div class="empty">Todo el inventario está por encima del mínimo.</div>')+'</div></div><div class="card" style="margin-top:16px"><h3 class="sectiontitle">Accesos rápidos</h3><div class="actions">'+btn('Punto de venta',"go('pos')",'secondary')+btn('Crear cotización',"quoteModal()",'secondary')+btn('Registrar compra',"purchaseModal()",'secondary')+btn('Ver reportes',"go('reports')",'secondary')+'</div></div>'}
function productRows(){let list=state.products.filter(p=>(p.name+' '+p.id+' '+p.brand+' '+p.category).toLowerCase().includes(searchTerm.toLowerCase()));return list.map(p=>'<tr><td><b>'+p.name+'</b><div class="hint">'+p.id+' · '+p.brand+'</div></td><td>'+p.category+'</td><td>'+money(p.cost)+'</td><td><b>'+money(p.sale)+'</b></td><td>'+badge(p.stock,p.stock===0?'red':p.stock<=p.min?'amber':'green')+'</td><td>'+p.min+'</td><td>'+btn('Editar',"productModal('"+p.id+"')",'ghost')+' '+btn('＋',"quickAdd('"+p.id+"')",'secondary')+'</td></tr>')}
function products(){return heading('Productos e inventario','Administra catálogo, precios y existencias.',btn('⇩ Exportar CSV',"exportCSV()",'ghost')+btn('＋ Nuevo producto','productModal()'))+'<div class="card"><div class="tools"><input class="search" placeholder="Buscar por nombre, SKU, marca..." value="'+searchTerm+'" oninput="searchTerm=this.value;renderTableOnly()"><span class="hint">'+state.products.length+' productos</span></div><div id="producttable">'+table(['Producto / SKU','Categoría','Costo','Precio venta','Stock','Mínimo','Acciones'],productRows())+'</div></div>'}
function renderTableOnly(){if(page==='products')$('#producttable').innerHTML=table(['Producto / SKU','Categoría','Costo','Precio venta','Stock','Mínimo','Acciones'],productRows());if(page==='sales')$('#salesTable').innerHTML=table(['Folio','Fecha','Cliente','Productos','Total','Pago','Acción'],salesRows());if(page==='clients')$('#clientTable').innerHTML=table(['Cliente','Contacto','Tipo','Saldo','Acción'],clientRows());if(page==='suppliers')$('#supplierTable').innerHTML=table(['Proveedor','Contacto','Teléfono','Condiciones','Acción'],supplierRows())}
function salesRows(){return state.sales.filter(s=>(s.id+' '+s.client).toLowerCase().includes(searchTerm.toLowerCase())).slice().reverse().map(s=>'<tr><td><b>'+s.id+'</b></td><td>'+s.date+'</td><td>'+s.client+'</td><td>'+s.items.reduce((a,i)=>a+i.qty,0)+'</td><td><b>'+money(s.total)+'</b></td><td>'+s.payment+'</td><td>'+btn('Ticket',"receipt('"+s.id+"')",'ghost')+'</td></tr>')}
function sales(){return heading('Ventas','Historial de operaciones y comprobantes.',btn('＋ Nueva venta',"go('pos')"))+'<div class="card"><div class="tools"><input class="search" placeholder="Buscar folio o cliente..." oninput="searchTerm=this.value;renderTableOnly()"></div><div id="salesTable">'+table(['Folio','Fecha','Cliente','Productos','Total','Pago','Acción'],salesRows())+'</div></div>'}
function pos(){let found=state.products.filter(p=>(p.name+' '+p.id).toLowerCase().includes(searchTerm.toLowerCase()));return heading('Punto de venta','Selecciona productos para crear una venta.',btn('Vaciar carrito','clearCart()','ghost'))+'<div class="posgrid"><div class="card"><div class="tools"><input class="search" placeholder="Buscar refacción o escanear SKU..." value="'+searchTerm+'" oninput="searchTerm=this.value;renderPosProducts()"></div><div id="posproducts" class="productcards">'+found.map(p=>'<button class="producttile" onclick="addCart(\''+p.id+'\')"><small>'+p.id+' · '+p.brand+'</small><b>'+p.name+'</b><small>Stock: '+p.stock+'</small><div style="font-weight:850;color:#2563eb;margin-top:9px">'+money(p.sale)+'</div></button>').join('')+'</div></div><div class="card"><h3 class="sectiontitle">Venta actual</h3><div class="field"><label>Cliente</label><select id="posclient"><option>Público general</option>'+state.clients.map(c=>'<option>'+c.name+'</option>').join('')+'</select></div><div id="cartitems" style="margin-top:14px">'+cartHTML()+'</div><div class="field" style="margin-top:14px"><label>Método de pago</label><select id="payment"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Crédito</option></select></div><div class="totalrow"><span>Subtotal</span><b>'+money(cart.reduce((a,i)=>a+i.price*i.qty,0))+'</b></div><div class="totalrow"><span>IVA incluido en precios (demo)</span><span>—</span></div><hr style="border:0;border-top:1px solid var(--line)"><div class="totalrow"><span>Total</span><span class="bigtotal">'+money(cart.reduce((a,i)=>a+i.price*i.qty,0))+'</span></div><button style="width:100%;margin-top:10px" onclick="checkout()">✓ Cobrar y registrar venta</button><div class="footerhint">Demo: el cobro no procesa pagos reales.</div></div></div>'}
function renderPosProducts(){if(page==='pos'){$('#posproducts').innerHTML=state.products.filter(p=>(p.name+' '+p.id).toLowerCase().includes(searchTerm.toLowerCase())).map(p=>'<button class="producttile" onclick="addCart(\''+p.id+'\')"><small>'+p.id+' · '+p.brand+'</small><b>'+p.name+'</b><small>Stock: '+p.stock+'</small><div style="font-weight:850;color:#2563eb;margin-top:9px">'+money(p.sale)+'</div></button>').join('')}}
function cartHTML(){return cart.length?cart.map(i=>'<div class="cartrow"><div style="flex:1"><b>'+i.name+'</b><div class="hint">'+money(i.price)+' c/u</div><div style="display:flex;gap:5px;margin-top:7px"><button class="secondary" style="padding:3px 9px" onclick="cartQty(\''+i.productId+'\',-1)">−</button><span style="padding:3px 6px">'+i.qty+'</span><button class="secondary" style="padding:3px 9px" onclick="cartQty(\''+i.productId+'\',1)">+</button></div></div><b>'+money(i.price*i.qty)+'</b></div>').join(''):'<div class="empty">Agrega productos para comenzar.</div>'}
function addCart(pid){let p=state.products.find(x=>x.id===pid);if(!p||p.stock<=0){alert('No hay existencias disponibles.');return}let item=cart.find(x=>x.productId===pid);if(item){if(item.qty>=p.stock){alert('La cantidad supera las existencias.');return}item.qty++}else cart.push({productId:p.id,name:p.name,qty:1,price:p.sale,cost:p.cost});render()}
function cartQty(pid,n){let i=cart.find(x=>x.productId===pid),p=state.products.find(x=>x.id===pid);if(!i)return;i.qty+=n;if(i.qty<=0)cart=cart.filter(x=>x.productId!==pid);if(i&&i.qty>(p?.stock||0)){i.qty--;alert('Stock insuficiente')}render()}
function clearCart(){cart=[];render()}
function checkout(){if(!cart.length)return alert('Agrega al menos un producto.');for(let i of cart){let p=state.products.find(x=>x.id===i.productId);if(!p||p.stock<i.qty)return alert('Existencias insuficientes para '+i.name)}let total=cart.reduce((a,i)=>a+i.price*i.qty,0),sale={id:id('V'),date:today(),client:$('#posclient').value,items:cart.map(i=>({...i})),total,payment:$('#payment').value,status:'Pagada'};for(let i of cart){let p=state.products.find(x=>x.id===i.productId);p.stock-=i.qty;state.stockMoves.push({id:id('MOV'),date:today(),productId:p.id,product:p.name,type:'Salida por venta',qty:-i.qty,reference:sale.id})}state.sales.push(sale);if(sale.payment==='Crédito'){let c=state.clients.find(c=>c.name===sale.client);if(c)c.balance+=total}state.cash.push({id:id('CA'),date:today(),type:'Ingreso',concept:'Venta '+sale.id+' · '+sale.payment,amount:total});save();cart=[];alert('Venta '+sale.id+' registrada por '+money(total));go('sales')}
function productModal(pid=''){let p=state.products.find(x=>x.id===pid)||{id:'',name:'',category:'Filtros',brand:'',cost:0,sale:0,stock:0,min:5,location:'',compat:''};modal('Producto', '<div class="formgrid">'+field('SKU / Código','id',p.id)+field('Nombre','name',p.name)+field('Categoría','category',p.category)+field('Marca','brand',p.brand)+field('Costo de compra','cost',p.cost,'number')+field('Precio de venta','sale',p.sale,'number')+field('Existencias','stock',p.stock,'number')+field('Stock mínimo','min',p.min,'number')+field('Ubicación','location',p.location)+field('Compatibilidad','compat',p.compat)+'</div>','Guardar producto', "saveProduct('"+pid+"')")}
function field(label,name,value,type='text'){return '<div class="field"><label>'+label+'</label><input name="'+name+'" value="'+String(value??'').replace(/"/g,'&quot;')+'" type="'+type+'" '+(type==='number'?'step="0.01" min="0"':'')+'></div>'}
function saveProduct(old){let f={};document.querySelectorAll('#modalroot [name]').forEach(i=>f[i.name]=i.type==='number'?Number(i.value):i.value.trim());if(!f.id||!f.name)return alert('SKU y nombre son obligatorios.');if(state.products.some(p=>p.id===f.id&&p.id!==old))return alert('Ese SKU ya existe.');if(old){let ix=state.products.findIndex(p=>p.id===old);state.products[ix]={...state.products[ix],...f}}else state.products.push(f);save();closeModal();render()}
function purchaseModal(){modal('Nueva orden de compra','<div class="formgrid">'+field('Folio','id',id('OC'))+'<div class="field"><label>Proveedor</label><select name="supplier">'+state.suppliers.map(s=>'<option>'+s.name+'</option>').join('')+'</select></div><div class="field"><label>Producto</label><select name="product">'+state.products.map(p=>'<option value="'+p.id+'">'+p.name+' · '+money(p.cost)+'</option>').join('')+'</select></div>'+field('Cantidad','qty',1,'number')+field('Costo unitario','cost',0,'number')+'</div><div class="hint" style="margin-top:10px">Al recibir la orden, el stock del producto aumenta automáticamente.</div>','Guardar orden','savePurchase()')}
function savePurchase(){let f={};document.querySelectorAll('#modalroot [name]').forEach(i=>f[i.name]=i.type==='number'?Number(i.value):i.value);let p=state.products.find(p=>p.id===f.product),total=f.qty*f.cost;if(!p||f.qty<=0)return alert('Revisa el producto y la cantidad.');let order={id:f.id,date:today(),supplier:f.supplier,status:'Recibida',total,items:[{productId:p.id,name:p.name,qty:f.qty,cost:f.cost}]};p.stock+=f.qty;p.cost=f.cost;state.purchases.push(order);state.stockMoves.push({id:id('MOV'),date:today(),productId:p.id,product:p.name,type:'Entrada por compra',qty:f.qty,reference:order.id});save();closeModal();render()}
function purchases(){return heading('Compras','Órdenes a proveedores y recepción de mercancía.',btn('＋ Nueva compra','purchaseModal()'))+'<div class="card">'+table(['Folio','Fecha','Proveedor','Estado','Artículos','Total'],state.purchases.slice().reverse().map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.date+'</td><td>'+o.supplier+'</td><td>'+badge(o.status,'green')+'</td><td>'+o.items.reduce((a,i)=>a+i.qty,0)+'</td><td><b>'+money(o.total)+'</b></td></tr>'))+'</div>'}
function quoteModal(){modal('Nueva cotización','<div class="formgrid">'+field('Folio','id',id('COT'))+'<div class="field"><label>Cliente</label><select name="client">'+['Público general',...state.clients.map(c=>c.name)].map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field full"><label>Refacción</label><select name="product">'+state.products.map(p=>'<option value="'+p.id+'">'+p.name+' · '+money(p.sale)+'</option>').join('')+'</select></div>'+field('Cantidad','qty',1,'number')+'</div>','Crear cotización','saveQuote()')}
function saveQuote(){let f={};document.querySelectorAll('#modalroot [name]').forEach(i=>f[i.name]=i.type==='number'?Number(i.value):i.value);let p=state.products.find(p=>p.id===f.product);if(!p||f.qty<=0)return alert('Cantidad inválida.');state.quotes.push({id:f.id,date:today(),client:f.client,status:'Pendiente',total:f.qty*p.sale,items:[{productId:p.id,name:p.name,qty:f.qty,price:p.sale}]});save();closeModal();render()}
function quotes(){return heading('Cotizaciones','Prepara propuestas para clientes y conviértelas en ventas.',btn('＋ Nueva cotización','quoteModal()'))+'<div class="card">'+table(['Folio','Fecha','Cliente','Artículos','Total','Estado','Acción'],state.quotes.slice().reverse().map(q=>'<tr><td><b>'+q.id+'</b></td><td>'+q.date+'</td><td>'+q.client+'</td><td>'+q.items.reduce((a,i)=>a+i.qty,0)+'</td><td><b>'+money(q.total)+'</b></td><td>'+badge(q.status,q.status==='Aceptada'?'green':'amber')+'</td><td>'+btn('Imprimir',"printQuote('"+q.id+"')",'ghost')+' '+(q.status==='Pendiente'?btn('Convertir en venta',"convertQuote('"+q.id+"')",'secondary'):'')+'</td></tr>'))+'</div>'}
function convertQuote(qid){let q=state.quotes.find(x=>x.id===qid);if(!q)return;if(!confirm('¿Convertir '+q.id+' en venta y descontar existencias?'))return;for(let i of q.items){let p=state.products.find(p=>p.id===i.productId);if(!p||p.stock<i.qty)return alert('Stock insuficiente para '+i.name)}let items=q.items.map(i=>{let p=state.products.find(p=>p.id===i.productId);return {productId:p.id,name:p.name,qty:i.qty,price:i.price,cost:p.cost}});items.forEach(i=>{state.products.find(p=>p.id===i.productId).stock-=i.qty});state.sales.push({id:id('V'),date:today(),client:q.client,items,total:q.total,payment:'Pendiente',status:'Pendiente de pago'});q.status='Aceptada';save();render()}
function clientModal(cid=''){let c=state.clients.find(x=>x.id===cid)||{id:id('CL'),name:'',phone:'',email:'',type:'Público',balance:0};modal('Cliente','<div class="formgrid">'+field('Folio','id',c.id)+field('Nombre / Razón social','name',c.name)+field('Teléfono','phone',c.phone)+field('Correo','email',c.email)+'<div class="field"><label>Tipo de cliente</label><select name="type"><option '+(c.type==='Público'?'selected':'')+'>Público</option><option '+(c.type==='Taller'?'selected':'')+'>Taller</option><option '+(c.type==='Empresa'?'selected':'')+'>Empresa</option></select></div>'+field('Saldo pendiente','balance',c.balance,'number')+'</div>','Guardar cliente',"saveContact('clients','"+cid+"')")}
function supplierModal(sid=''){let s=state.suppliers.find(x=>x.id===sid)||{id:id('PR'),name:'',contact:'',phone:'',email:'',terms:'Contado'};modal('Proveedor','<div class="formgrid">'+field('Folio','id',s.id)+field('Empresa','name',s.name)+field('Contacto','contact',s.contact)+field('Teléfono','phone',s.phone)+field('Correo','email',s.email)+field('Condiciones','terms',s.terms)+'</div>','Guardar proveedor',"saveContact('suppliers','"+sid+"')")}
function saveContact(type,old){let f={};document.querySelectorAll('#modalroot [name]').forEach(i=>f[i.name]=i.type==='number'?Number(i.value):i.value.trim());if(!f.name)return alert('El nombre es obligatorio.');let arr=state[type];if(old){let ix=arr.findIndex(x=>x.id===old);arr[ix]={...arr[ix],...f}}else arr.push(f);save();closeModal();render()}
function clientRows(){return state.clients.filter(c=>(c.name+' '+c.id).toLowerCase().includes(searchTerm.toLowerCase())).map(c=>'<tr><td><b>'+c.name+'</b><div class="hint">'+c.id+' · '+c.email+'</div></td><td>'+c.phone+'</td><td>'+c.type+'</td><td>'+money(c.balance)+'</td><td>'+btn('Editar',"clientModal('"+c.id+"')",'ghost')+'</td></tr>')}
function clients(){return heading('Clientes','Directorio e historial comercial.',btn('＋ Nuevo cliente','clientModal()'))+'<div class="card"><div class="tools"><input class="search" placeholder="Buscar cliente..." oninput="searchTerm=this.value;renderTableOnly()"></div><div id="clientTable">'+table(['Cliente','Contacto','Tipo','Saldo','Acción'],clientRows())+'</div></div>'}
function supplierRows(){return state.suppliers.filter(s=>(s.name+' '+s.id).toLowerCase().includes(searchTerm.toLowerCase())).map(s=>'<tr><td><b>'+s.name+'</b><div class="hint">'+s.id+' · '+s.email+'</div></td><td>'+s.contact+'</td><td>'+s.phone+'</td><td>'+s.terms+'</td><td>'+btn('Editar',"supplierModal('"+s.id+"')",'ghost')+'</td></tr>')}
function suppliers(){return heading('Proveedores','Contactos, condiciones de compra y abastecimiento.',btn('＋ Nuevo proveedor','supplierModal()'))+'<div class="card"><div class="tools"><input class="search" placeholder="Buscar proveedor..." oninput="searchTerm=this.value;renderTableOnly()"></div><div id="supplierTable">'+table(['Proveedor','Contacto','Teléfono','Condiciones','Acción'],supplierRows())+'</div></div>'}
function cash(){let income=state.cash.filter(c=>c.type==='Ingreso').reduce((a,c)=>a+c.amount,0),out=state.cash.filter(c=>c.type==='Egreso').reduce((a,c)=>a+c.amount,0);return heading('Caja','Control de ingresos, egresos y movimientos registrados.',btn('＋ Registrar movimiento','cashModal()'))+'<div class="grid">'+metric('Ingresos acumulados',money(income),'Registros de caja','↗')+metric('Egresos acumulados',money(out),'Registros de caja','↘')+metric('Saldo neto',money(income-out),'Ingresos menos egresos','＄')+metric('Movimientos',state.cash.length,'Historial local','▤')+'</div><div class="card"><h3 class="sectiontitle">Movimientos de caja</h3>'+table(['Folio','Fecha','Tipo','Concepto','Importe'],state.cash.slice().reverse().map(c=>'<tr><td>'+c.id+'</td><td>'+c.date+'</td><td>'+badge(c.type,c.type==='Ingreso'?'green':'amber')+'</td><td>'+c.concept+'</td><td><b>'+money(c.amount)+'</b></td></tr>'))+'</div>'}
function cashModal(){modal('Movimiento de caja','<div class="formgrid"><div class="field"><label>Tipo</label><select name="type"><option>Ingreso</option><option>Egreso</option></select></div>'+field('Concepto','concept','')+field('Importe','amount',0,'number')+'</div>','Guardar movimiento','saveCash()')}
function saveCash(){let f={};document.querySelectorAll('#modalroot [name]').forEach(i=>f[i.name]=i.type==='number'?Number(i.value):i.value);if(!f.concept||f.amount<=0)return alert('Indica concepto e importe válido.');state.cash.push({id:id('CA'),date:today(),...f});save();closeModal();render()}
function reports(){let rev=state.sales.reduce((a,s)=>a+s.total,0),cost=state.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty*i.cost,0),0),counts={};state.sales.forEach(s=>s.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+i.qty));let top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);return heading('Reportes y análisis','Indicadores calculados con los datos actuales de la demo.',btn('⇩ Exportar ventas CSV','exportSales()','ghost'))+'<div class="grid">'+metric('Ventas totales',money(rev),state.sales.length+' ventas','↗')+metric('Costo de mercancía',money(cost),'Costo registrado en ventas','▤')+metric('Utilidad bruta',money(rev-cost),'No incluye gastos generales','◈')+metric('Margen bruto',rev?((rev-cost)/rev*100).toFixed(1)+'%':'0%','Utilidad / ventas','%')+'</div><div class="split"><div class="card"><h3 class="sectiontitle">Productos más vendidos</h3>'+top.map(([name,n])=>'<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>'+name+'</span><b>'+n+' pzas.</b></div><div class="bar"><span style="width:'+Math.max(4,n/(top[0]?.[1]||1)*100)+'%"></span></div></div>').join('')+'</div><div class="card"><h3 class="sectiontitle">Resumen de inventario</h3>'+table(['Indicador','Valor'],[['Productos registrados',state.products.length],['Piezas en existencia',state.products.reduce((a,p)=>a+p.stock,0)],['Valor al costo',money(state.products.reduce((a,p)=>a+p.stock*p.cost,0))],['Productos bajo mínimo',lowStock().length],['Cotizaciones pendientes',state.quotes.filter(q=>q.status==='Pendiente').length]].map(r=>'<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>'))+'</div></div><div class="notice" style="margin-top:16px">Las métricas son orientativas y usan las operaciones de ejemplo y las registradas durante esta sesión de demostración.</div>'}
function settings(){return heading('Configuración y respaldo','Personaliza la demo y administra tus datos locales.')+'<div class="split"><div class="card"><h3 class="sectiontitle">Datos del negocio</h3><div class="formgrid">'+field('Nombre comercial','business','RefacPro Demo')+field('Moneda','currency','MXN')+field('Teléfono','phone','55 0000 0000')+field('Correo','email','demo@refacpro.test')+'</div><div style="margin-top:16px">'+btn('Guardar configuración',"saveSettings()")+'</div><p class="hint">En esta versión, los datos comerciales son informativos.</p></div><div class="card"><h3 class="sectiontitle">Respaldo y datos de prueba</h3><p class="sub">Exporta tus registros locales a JSON o importa un respaldo previo.</p><div class="actions" style="margin:14px 0">'+btn('⇩ Descargar respaldo JSON','backup()')+'<label class="buttonlike"><input id="restorefile" type="file" accept=".json,application/json" onchange="restore(event)" hidden><button class="secondary" onclick="document.getElementById(\'restorefile\').click()">Importar respaldo</button></label></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="hint">Restablecer borra los cambios locales y carga los datos ficticios iniciales.</p>'+btn('Restablecer demo','resetDemo()','danger')+'</div></div><div class="card" style="margin-top:16px"><h3 class="sectiontitle">Estado de la aplicación</h3>'+table(['Característica','Estado'],[['Persistencia local','Activa'],['Modo instalación PWA','Disponible en HTTPS / localhost'],['Sincronización multiusuario','No incluida en esta demo'],['Pagos reales / facturación fiscal','No habilitados'],['Último guardado local',new Date().toLocaleString('es-MX')]].map(r=>'<tr><td>'+r[0]+'</td><td>'+badge(r[1],r[1]==='Activa'?'green':'amber')+'</td></tr>'))+'</div>'}
function saveSettings(){alert('Configuración de muestra guardada solo para esta vista.')}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='refacpro-respaldo-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.products||!obj.sales)throw Error('Formato inválido');state=obj;save();render();alert('Respaldo importado.')}catch(err){alert('No se pudo importar el archivo JSON.')}};reader.readAsText(file)}
function resetDemo(){if(confirm('¿Restablecer todos los cambios locales y recuperar los datos de ejemplo?')){state=structuredClone(seed);cart=[];save();render()}}
function exportCSV(){downloadCSV('refacpro-inventario.csv',['SKU','Producto','Categoría','Marca','Costo','Precio','Stock','Mínimo'],state.products.map(p=>[p.id,p.name,p.category,p.brand,p.cost,p.sale,p.stock,p.min]))}
function exportSales(){downloadCSV('refacpro-ventas.csv',['Folio','Fecha','Cliente','Total','Pago','Estado'],state.sales.map(s=>[s.id,s.date,s.client,s.total,s.payment,s.status]))}
function downloadCSV(name,headers,rows){let csv=[headers,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function receipt(sid){let s=state.sales.find(x=>x.id===sid);if(!s)return;let w=window.open('','_blank');if(!w)return alert('Permite las ventanas emergentes para imprimir.');w.document.write('<html><head><title>Ticket '+s.id+'</title><style>body{font:14px monospace;max-width:340px;margin:20px auto}h2{text-align:center}hr{border:0;border-top:1px dashed #555}p{display:flex;justify-content:space-between}</style></head><body><h2>REFACPRO DEMO</h2><center>Comprobante de demostración</center><hr><p>Folio: '+s.id+'</p><p>Fecha: '+s.date+'</p><p>Cliente: '+s.client+'</p><hr>'+s.items.map(i=>'<p>'+i.qty+' x '+i.name+'<br>'+money(i.qty*i.price)+'</p>').join('')+'<hr><p><b>TOTAL</b><b>'+money(s.total)+'</b></p><p>Pago: '+s.payment+'</p><center>Gracias por su compra</center><script>window.print()<\/script></body></html>');w.document.close()}
function printQuote(qid){let q=state.quotes.find(x=>x.id===qid);if(!q)return;let w=window.open('','_blank');if(!w)return;w.document.write('<h2>RefacPro · Cotización '+q.id+'</h2><p>Fecha: '+q.date+'</p><p>Cliente: '+q.client+'</p><table border="1" cellpadding="8"><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Importe</th></tr>'+q.items.map(i=>'<tr><td>'+i.name+'</td><td>'+i.qty+'</td><td>'+money(i.price)+'</td><td>'+money(i.qty*i.price)+'</td></tr>').join('')+'</table><h3>Total: '+money(q.total)+'</h3><p>Precios y existencias sujetos a confirmación. Cotización de demostración.</p><script>window.print()<\/script>');w.document.close()}
function modal(title,body,saveLabel,saveAction){$('#modalroot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>'+title+'</h2><button class="ghost" onclick="closeModal()">✕</button></div>'+body+'<div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button onclick="'+saveAction+'">'+saveLabel+'</button></div></div></div>'}
function closeModal(){$('#modalroot').innerHTML=''}
function render(){save();let views={dashboard:dash,pos,products,purchases,quotes,sales,cash,clients,suppliers,reports,settings};$('#app').innerHTML=views[page]();$('#crumb').textContent=pageNames[page]}
render();if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
